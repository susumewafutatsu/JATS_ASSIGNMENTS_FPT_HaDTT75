<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DevDash - Product Dashboard</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DTexCdQm.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>VIRTUE <span>Shop</span></h1>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <input id="searchInput" type="text" placeholder="Tìm kiếm sản phẩm..." />
            <select id="categorySelect">
                <option value="">Tất cả danh mục</option>
            </select>
            <select id="sortSelect">
                <option value="">Sắp xếp mặc định</option>
                <option value="price-asc">Giá: Thấp đến cao</option>
                <option value="price-desc">Giá: Cao đến thấp</option>
                <option value="name">Tên sản phẩm</option>
            </select>
        </div>

        <div id="status" class="status-bar"></div>
        <div id="productList" class="grid-container"></div>
        <div id="productDetail" class="detail-container"></div>
    </main>
    
</body>
</html>
